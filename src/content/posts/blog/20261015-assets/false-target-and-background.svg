<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">假目标与干扰遮障：两种不同的信息作用</title>
  <desc id="desc">左栏以两条抽象特征曲线对照真实对象与人工对象，说明假目标关注人工特征能否被判断为真实。右栏以目标表征和背景表征的重叠说明干扰遮障关注目标与背景的可分辨性。所有曲线均为原创概念示意，无实测数据和性能预测含义，不表示器材配置或部署。</desc>
  <!-- Original article illustration. Fixed independent content palette; no deployment or quantitative data. -->
  <style>
    text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#33362f}
    .title{font-size:38px;font-weight:700}.sub{font-size:24px;fill:#66675b}
    .head{font-size:30px;font-weight:700}.body{font-size:24px}
    .small{font-size:22px;fill:#66675b}.olive{fill:#697255}.brown{fill:#937156}
    .axis{stroke:#b8b4a6;stroke-width:2;fill:none}
  </style>
  <rect width="1200" height="780" fill="#f5f1e7"/>
  <text x="58" y="72" class="title">假目标与干扰遮障</text>
  <text x="58" y="114" class="sub">对象特征的可信程度，与目标和背景的可分辨性，是两个问题。</text>
  <path d="M600 166V674" stroke="#d3cbbb" stroke-width="2"/>

  <text x="58" y="200" class="head">假目标：模拟对象特征</text>
  <text x="58" y="244" class="body">人工对象是否被当作真实？</text>
  <path class="axis" d="M80 495H548M80 495V299"/>
  <path d="M86 467C120 463 123 393 155 393S187 458 214 440S239 336 272 330S316 438 342 425S378 353 411 369S460 473 540 449" fill="none" stroke="#41473d" stroke-width="5"/>
  <path d="M86 474C119 465 129 400 157 401S187 466 215 448S244 349 274 341S312 449 343 435S377 365 412 380S467 482 540 457" fill="none" stroke="#778463" stroke-width="5" stroke-dasharray="10 8"/>
  <path d="M84 538H130" stroke="#41473d" stroke-width="5"/>
  <text x="142" y="546" class="small">真实对象特征（参照）</text>
  <path d="M84 580H130" stroke="#778463" stroke-width="5" stroke-dasharray="10 8"/>
  <text x="142" y="588" class="small">人工对象特征（示意）</text>
  <text x="80" y="633" class="body olive">特征相似，还需经过判断。</text>

  <text x="650" y="200" class="head">干扰遮障：改变背景表征</text>
  <text x="650" y="244" class="body">目标与背景还能否分辨？</text>
  <path class="axis" d="M672 495H1138M672 495V299"/>
  <path d="M678 492C704 492 710 445 731 448S757 389 784 403S811 359 836 371S864 407 888 383S919 351 945 368S978 420 999 396S1025 395 1047 429S1076 431 1093 458S1120 481 1130 492Z" fill="#c4a88a" opacity=".55"/>
  <path d="M678 492C704 492 710 445 731 448S757 389 784 403S811 359 836 371S864 407 888 383S919 351 945 368S978 420 999 396S1025 395 1047 429S1076 431 1093 458S1120 481 1130 492" fill="none" stroke="#937156" stroke-width="4"/>
  <path d="M678 490C797 490 805 487 833 462S870 386 906 386S946 465 979 483S1057 490 1130 490" fill="none" stroke="#697255" stroke-width="5"/>
  <path d="M676 538H722" stroke="#937156" stroke-width="5"/>
  <text x="734" y="546" class="small">背景表征（示意）</text>
  <path d="M676 580H722" stroke="#697255" stroke-width="5"/>
  <text x="734" y="588" class="small">目标表征（示意）</text>
  <text x="672" y="633" class="body olive">背景增强，效果仍需验证。</text>

  <path d="M58 686H1142" stroke="#d3cbbb" stroke-width="2"/>
  <text x="58" y="724" class="small">曲线不含物理量或数值，仅表达概念关系。</text>
  <text x="58" y="758" class="small">概念示意，非实测结果。</text>
</svg>
