<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">杀伤链六环节中的信息变化</title>
  <desc id="desc">六个节点依次表示发现、识别定位、跟踪、目标分配、打击和评估，关注的信息从初始线索、身份与位置、持续关联、行动决策、实际作用走向结果反馈。评估的反馈箭头返回前面的信息处理过程。该图为功能关系概念示意，不代表固定串行时间表、器材部署或实测时间。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#697255" stroke-width="2"/></marker>
    <marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#937156" stroke-width="2"/></marker>
  </defs>
  <style>
    text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#33362f}
    .title{font-size:38px;font-weight:700}.sub{font-size:24px;fill:#66675b}
    .stage{font-size:30px;font-weight:700;text-anchor:middle}.keyword{font-size:25px;text-anchor:middle}.keyword text{fill:#697255}
    .body{font-size:22px;text-anchor:middle}.body text{fill:#66675b}.number{font-size:26px;font-weight:700;text-anchor:middle}.number text{fill:#f5f1e7}
    .small{font-size:22px;fill:#66675b}.feedback{font-size:24px;fill:#937156;text-anchor:middle}
  </style>
  <rect width="1200" height="680" fill="#f5f1e7"/>
  <text x="58" y="72" class="title">六环节之间，变化的是信息要求</text>
  <text x="58" y="116" class="sub">从初始线索到结果反馈，每一步都需要新的判断依据。</text>

  <g fill="none" stroke="#697255" stroke-width="3" marker-end="url(#arrow)">
    <path d="M142 220H252"/><path d="M342 220H452"/><path d="M542 220H652"/>
    <path d="M742 220H852"/><path d="M942 220H1052"/>
  </g>
  <g fill="#697255">
    <circle cx="100" cy="220" r="40"/><circle cx="300" cy="220" r="40"/><circle cx="500" cy="220" r="40"/>
    <circle cx="700" cy="220" r="40"/><circle cx="900" cy="220" r="40"/><circle cx="1100" cy="220" r="40"/>
  </g>
  <g class="number"><text x="100" y="229">01</text><text x="300" y="229">02</text><text x="500" y="229">03</text><text x="700" y="229">04</text><text x="900" y="229">05</text><text x="1100" y="229">06</text></g>

  <g class="stage"><text x="100" y="313">发现</text><text x="300" y="313">识别定位</text><text x="500" y="313">跟踪</text><text x="700" y="313">目标分配</text><text x="900" y="313">打击</text><text x="1100" y="313">评估</text></g>
  <g class="keyword"><text x="100" y="369">初始线索</text><text x="300" y="369">身份与位置</text><text x="500" y="369">持续关联</text><text x="700" y="369">行动决策</text><text x="900" y="369">实际作用</text><text x="1100" y="369">结果反馈</text></g>
  <g class="body">
    <text x="100" y="417"><tspan x="100">有值得关注的</tspan><tspan x="100" dy="32">对象吗？</tspan></text>
    <text x="300" y="417"><tspan x="300">是什么、在哪里，</tspan><tspan x="300" dy="32">信息够用吗？</tspan></text>
    <text x="500" y="417"><tspan x="500">后续观测仍是</tspan><tspan x="500" dy="32">同一对象吗？</tspan></text>
    <text x="700" y="417"><tspan x="700">依据是否足以</tspan><tspan x="700" dy="32">支持行动？</tspan></text>
    <text x="900" y="417"><tspan x="900">是否作用于</tspan><tspan x="900" dy="32">预定对象？</tspan></text>
    <text x="1100" y="417"><tspan x="1100">发生了什么，</tspan><tspan x="1100" dy="32">目的达到吗？</tspan></text>
  </g>

  <path d="M1100 472V528Q1100 552 1076 552H124Q100 552 100 528V472" fill="none" stroke="#937156" stroke-width="2.5" marker-end="url(#feedback)"/>
  <rect x="371" y="532" width="458" height="40" fill="#f5f1e7"/>
  <text x="600" y="560" class="feedback">结果反馈可触发复核与重新判断</text>
  <path d="M58 604H1142" stroke="#d3cbbb" stroke-width="2"/>
  <text x="58" y="643" class="small">功能可能并行、反复或返回先前环节。概念示意，非实测时间。</text>
</svg>
