<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">流程压缩与功能保留的概念关系</title>
  <desc id="desc">上半部分将发现、识别定位、跟踪、目标分配、打击和评估六项功能画为串行关系。下半部分保留同样六项功能，以跟踪与目标分配的重叠说明部分功能可以并行。两种画法只表达抽象功能关系，不代表具体作战组织方式、真实时间比例或实际加速效果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#697255" stroke-width="2"/></marker>
  </defs>
  <style>
    text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#33362f}
    .title{font-size:38px;font-weight:700}.sub{font-size:24px;fill:#66675b}
    .head{font-size:27px;font-weight:700}.stage{font-size:26px;font-weight:700;text-anchor:middle}
    .body{font-size:24px;fill:#66675b}.small{font-size:22px;fill:#66675b}
    .node{fill:#e5e5d8;stroke:#a4ad91;stroke-width:2}.parallel{fill:#e9dfd0;stroke:#b39576;stroke-width:2}
    .link{fill:none;stroke:#697255;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="850" fill="#f5f1e7"/>
  <text x="58" y="72" class="title">流程压缩，不等于功能消失</text>
  <text x="58" y="116" class="sub">“发现即摧毁”强调响应速度，仍需满足相应的信息与判断要求。</text>

  <text x="58" y="196" class="head">逐项理解六项功能</text>
  <g class="node">
    <rect x="60" y="234" width="165" height="76" rx="12"/><rect x="243" y="234" width="165" height="76" rx="12"/>
    <rect x="426" y="234" width="165" height="76" rx="12"/><rect x="609" y="234" width="165" height="76" rx="12"/>
    <rect x="792" y="234" width="165" height="76" rx="12"/><rect x="975" y="234" width="165" height="76" rx="12"/>
  </g>
  <g class="stage"><text x="142.5" y="282">发现</text><text x="325.5" y="282">识别定位</text><text x="508.5" y="282">跟踪</text><text x="691.5" y="282">目标分配</text><text x="874.5" y="282">打击</text><text x="1057.5" y="282">评估</text></g>
  <g class="link"><path d="M225 272H240"/><path d="M408 272H423"/><path d="M591 272H606"/><path d="M774 272H789"/><path d="M957 272H972"/></g>
  <text x="60" y="356" class="body">串行画法便于解释，不表示实际过程必须依次等待。</text>

  <path d="M58 401H1142" stroke="#d3cbbb" stroke-width="2"/>
  <text x="58" y="455" class="head">部分功能可以重叠</text>
  <g class="node">
    <rect x="60" y="555" width="165" height="76" rx="12"/><rect x="243" y="555" width="165" height="76" rx="12"/>
    <rect x="792" y="555" width="165" height="76" rx="12"/><rect x="975" y="555" width="165" height="76" rx="12"/>
  </g>
  <g class="parallel"><rect x="491" y="495" width="195" height="76" rx="12"/><rect x="491" y="615" width="195" height="76" rx="12"/></g>
  <g class="stage"><text x="142.5" y="603">发现</text><text x="325.5" y="603">识别定位</text><text x="588.5" y="543">跟踪</text><text x="588.5" y="663">目标分配</text><text x="874.5" y="603">打击</text><text x="1057.5" y="603">评估</text></g>
  <g class="link">
    <path d="M225 593H240"/>
    <path d="M408 593H447V533H488"/><path d="M447 593V653H488"/>
    <path d="M686 533H738V593H789"/><path d="M686 653H738V593" style="marker-end:none"/>
    <path d="M957 593H972"/>
  </g>

  <text x="60" y="740" class="body">六项功能仍然存在；重叠关系取决于条件，图中仅列一种抽象表达。</text>
  <path d="M58 775H1142" stroke="#d3cbbb" stroke-width="2"/>
  <text x="58" y="815" class="small">概念示意，非实测时间。图形长度不对应实际耗时或性能比例。</text>
</svg>
