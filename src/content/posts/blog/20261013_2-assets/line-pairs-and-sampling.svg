ght="30" rx="3" fill="#8b8890" stroke="none"/><rect x="405" y="498" width="48" height="30" rx="3" fill="#8b8890" stroke="none"/><rect x="455" y="498" width="48" height="30" rx="3" fill="#8b8890" stroke="none"/><rect x="505" y="498" width="48" height="30" rx="3" fill="#8b8890" stroke="none"/><rect x="555" y="498" width="48" height="30" rx="3" fill="#8b8890" stroke="none"/><rect x="605" y="498" width="48" height="30" rx="3" fill="#8b8890" stroke="none"/><rect x="655" y="498" width="48" height="30" rx="3" fill="#8b8890" stroke="none"/><text x="724" y="446" font-size="20" fill="#75438a" text-anchor="start" font-weight="400">像元宽度 p</text><text x="724" y="504" font-size="20" fill="#62596d" text-anchor="start" font-weight="400">采样输出</text><text x="44" y="510" font-size="18" fill="#62596d" text-anchor="start" font-weight="400">各像元均跨越等宽亮暗区域</text><rect x="44" y="563" width="912" height="39" rx="12" fill="#eee6f3" stroke="none"/><text x="64" y="589" font-size="20" fill="#292333" text-anchor="start" font-weight="400">理想条纹、均匀面积积分示意；两像元 / 周期并不保证可靠分辨。</text></svg>
