<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">线对与像元：采样位置也会改变结果</title><desc id="desc">同一组周期条纹，每个周期两个像元；改变像元与条纹的相对位置。</desc>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style>
<rect x="0" y="0" width="1000" height="620" rx="24" fill="#faf7fc" stroke="none"/><text x="44" y="60" font-size="30" fill="#292333" text-anchor="start" font-weight="700">线对与像元：采样位置也会改变结果</text><text x="44" y="96" font-size="20" fill="#62596d" text-anchor="start" font-weight="400">同一组周期条纹，每个周期两个像元；改变像元与条纹的相对位置。</text>
<text x="44" y="171" font-size="23" fill="#292333" text-anchor="start" font-weight="600">连续亮暗条纹</text><rect x="280" y="132" width="50" height="60" rx="0" fill="#333039" stroke="none"/><rect x="330" y="132" width="50" height="60" rx="0" fill="#e3dfe7" stroke="none"/><rect x="380" y="132" width="50" height="60" rx="0" fill="#333039" stroke="none"/><rect x="430" y="132" width="50" height="60" rx="0" fill="#e3dfe7" stroke="none"/><rect x="480" y="132" width="50" height="60" rx="0" fill="#333039" stroke="none"/><rect x="530" y="132" width="50" height="60" rx="0" fill="#e3dfe7" stroke="none"/><rect x="580" y="132" width="50" height="60" rx="0" fill="#333039" stroke="none"/><rect x="630" y="132" width="50" height="60" rx="0" fill="#e3dfe7" stroke="none"/><line x1="280" y1="206" x2="380" y2="206" stroke="#75438a" stroke-width="2"/><line x1="275" y1="201" x2="285" y2="211" stroke="#75438a" stroke-width="2"/><line x1="375" y1="201" x2="385" y2="211" stroke="#75438a" stroke-width="2"/><text x="330" y="237" font-size="19" fill="#75438a" text-anchor="middle" font-weight="400">一个线对 / 一个周期</text><text x="724" y="170" font-size="21" fill="#292333" text-anchor="start" font-weight="400">暗 + 亮 = 1 线对</text><text x="44" y="298" font-size="21" fill="#292333" text-anchor="start" font-weight="600">采样 A：边界对齐</text><rect x="280" y="278" width="50" height="48" rx="0" fill="#333039" stroke="none"/><rect x="330" y="278" width="50" height="48" rx="0" fill="#e3dfe7" stroke="none"/><rect x="380" y="278" width="50" height="48" rx="0" fill="#333039" stroke="none"/><rect x="430" y="278" width="50" height="48" rx="0" fill="#e3dfe7" stroke="none"/><rect x="480" y="278" width="50" height="48" rx="0" fill="#333039" stroke="none"/><rect x="530" y="278" width="50" height="48" rx="0" fill="#e3dfe7" stroke="none"/><rect x="580" y="278" width="50" height="48" rx="0" fill="#333039" stroke="none"/><rect x="630" y="278" width="50" height="48" rx="0" fill="#e3dfe7" stroke="none"/><line x1="280" y1="270" x2="280" y2="334" stroke="#75438a" stroke-width="2"/><line x1="330" y1="270" x2="330" y2="334" stroke="#75438a" stroke-width="2"/><line x1="380" y1="270" x2="380" y2="334" stroke="#75438a" stroke-width="2"/><line x1="430" y1="270" x2="430" y2="334" stroke="#75438a" stroke-width="2"/><line x1="480" y1="270" x2="480" y2="334" stroke="#75438a" stroke-width="2"/><line x1="530" y1="270" x2="530" y2="334" stroke="#75438a" stroke-width="2"/><line x1="580" y1="270" x2="580" y2="334" stroke="#75438a" stroke-width="2"/><line x1="630" y1="270" x2="630" y2="334" stroke="#75438a" stroke-width="2"/><line x1="680" y1="270" x2="680" y2="334" stroke="#75438a" stroke-width="2"/><rect x="280" y="350" width="48" height="30" rx="3" fill="#333039" stroke="none"/><rect x="330" y="350" width="48" height="30" rx="3" fill="#e3dfe7" stroke="none"/><rect x="380" y="350" width="48" height="30" rx="3" fill="#333039" stroke="none"/><rect x="430" y="350" width="48" height="30" rx="3" fill="#e3dfe7" stroke="none"/><rect x="480" y="350" width="48" height="30" rx="3" fill="#333039" stroke="none"/><rect x="530" y="350" width="48" height="30" rx="3" fill="#e3dfe7" stroke="none"/><rect x="580" y="350" width="48" height="30" rx="3" fill="#333039" stroke="none"/><rect x="630" y="350" width="48" height="30" rx="3" fill="#e3dfe7" stroke="none"/><text x="724" y="298" font-size="20" fill="#75438a" text-anchor="start" font-weight="400">像元宽度 p</text><text x="724" y="356" font-size="20" fill="#62596d" text-anchor="start" font-weight="400">采样输出</text><text x="44" y="362" font-size="18" fill="#62596d" text-anchor="start" font-weight="400">积分结果保持亮暗交替</text><text x="44" y="446" font-size="21" fill="#292333" text-anchor="start" font-weight="600">采样 B：偏移半个像元</text><rect x="280" y="426" width="25" height="48" rx="0" fill="#e3dfe7" stroke="none"/><rect x="305" y="426" width="50" height="48" rx="0" fill="#333039" stroke="none"/><rect x="355" y="426" width="50" height="48" rx="0" fill="#e3dfe7" stroke="none"/><rect x="405" y="426