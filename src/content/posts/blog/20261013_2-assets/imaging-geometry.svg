<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">目标怎样投影到探测器上？</title><desc id="desc">投影尺寸 H 经镜头成像为 h；像面上的采样数量约为 h / p。</desc>
<style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif}</style>
<rect x="0" y="0" width="1000" height="620" rx="24" fill="#faf7fc" stroke="none"/><text x="44" y="60" font-size="30" fill="#292333" text-anchor="start" font-weight="700">目标怎样投影到探测器上？</text><text x="44" y="96" font-size="20" fill="#62596d" text-anchor="start" font-weight="400">投影尺寸 H 经镜头成像为 h；像面上的采样数量约为 h / p。</text>
<line x1="94" y1="286" x2="913" y2="286" stroke="#62596d" stroke-width="1" stroke-dasharray="6 6"/><line x1="180" y1="176" x2="180" y2="396" stroke="#277582" stroke-width="10"/><text x="180" y="148" font-size="24" fill="#277582" text-anchor="middle" font-weight="600">目标</text><ellipse cx="530" cy="286" rx="18" ry="145" fill="#eee6f3" stroke="#75438a" stroke-width="3"/><text x="530" y="127" font-size="22" fill="#75438a" text-anchor="middle" font-weight="600">镜头（等效投影中心）</text><line x1="180" y1="176" x2="790" y2="368" stroke="#75438a" stroke-width="2"/><line x1="180" y1="396" x2="790" y2="204" stroke="#277582" stroke-width="2"/><line x1="790" y1="174" x2="790" y2="399" stroke="#292333" stroke-width="4"/><text x="805" y="146" font-size="23" fill="#292333" text-anchor="middle" font-weight="600">焦平面</text><rect x="790" y="206" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="216" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="226" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="236" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="246" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="256" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="266" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="276" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="286" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="296" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="306" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="316" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="326" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="336" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="346" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><rect x="790" y="356" width="26" height="10" rx="0" fill="#eee6f3" stroke="#75438a"/><line x1="130" y1="176" x2="130" y2="396" stroke="#277582" stroke-width="2"/><line x1="125" y1="171" x2="135" y2="181" stroke="#277582" stroke-width="2"/><line x1="125" y1="391" x2="135" y2="401" stroke="#277582" stroke-width="2"/><text x="107" y="294" font-size="28" fill="#277582" text-anchor="middle" font-weight="400">H</text><line x1="850" y1="206" x2="850" y2="366" stroke="#75438a" stroke-width="2"/><line x1="845" y1="201" x2="855" y2="211" stroke="#75438a" stroke-width="2"/><line x1="845" y1="361" x2="855" y2="371" stroke="#75438a" stroke-width="2"/><text x="878" y="294" font-size="28" fill="#75438a" text-anchor="start" font-weight="400">h</text><line x1="180" y1="440" x2="530" y2="440" stroke="#277582" stroke-width="2"/><line x1="175" y1="435" x2="185" y2="445" stroke="#277582" stroke-width="2"/><line x1="525" y1="435" x2="535" y2="445" stroke="#277582" stroke-width="2"/><text x="355" y="475" font-size="22" fill="#277582" text-anchor="middle" font-weight="400">目标距离 R</text><line x1="530" y1="440" x2="790" y2="440" stroke="#75438a" stroke-width="2"/><line x1="525" y1="435" x2="535" y2="445" stroke="#75438a" stroke-width="2"/><line x1="785" y1="435" x2="795" y2="445" stroke="#75438a" stroke-width="2"/><text x="660" y="475" font-size="22" fill="#75438a" text-anchor="middle" font-weight="400">焦距 f</text><line x1="816" y1="216" x2="900" y2="235" stroke="#75438a" stroke-width="2"/><text x="903" y="255" font-size="26" fill="#75438a" text-anchor="start" font-weight="400">p</text><text x="855" y="396" font-size="19" fill="#62596d" text-anchor="start" font-weight="400">像元间距</text><rect x="44" y="510" width="912" height="84" rx="16" fill="#eee6f3" stroke="none"/><text x="74" y="546" font-size="28" fill="#292333" text-anchor="start" font-weight="600">h ≈ Hf / R； n ≈ h / p ≈ Hf / (Rp)</text><text x="74" y="579" font-size="19" fill="#62596d" text-anchor="start" font-weight="400">远距离、小角度近似；倒像示意，目标距离与焦距未按真实比例绘制。</text></svg>
