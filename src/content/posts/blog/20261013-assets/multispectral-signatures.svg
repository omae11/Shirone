<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="970" viewBox="0 0 1800 970"><rect width="100%" height="100%" fill="#f5f3f0" /><text x="80" y="55" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="58" font-weight="700" fill="#282f31">同一个目标，不同的可观测特征</text><text x="82" y="143" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#596266">多光谱伪装需要处理多种信号来源，而不只是增加迷彩颜色。</text><rect x="80" y="242" width="524" height="616" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><text x="112" y="267" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#526754">01</text><text x="112" y="315" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#282f31">可见光 / NIR / SWIR</text><text x="112" y="374" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#596266">主要观察：外部光的反射</text><polyline points="155,453 277,508 425,433" stroke="#526754" stroke-width="4" fill="none" /><polyline points="155,479 277,534 425,459" stroke="#526754" stroke-width="4" fill="none" /><polyline points="155,505 277,560 425,485" stroke="#526754" stroke-width="4" fill="none" /><rect x="190" y="572" width="303" height="39" rx="10" fill="#526754" stroke="#526754" stroke-width="2" /><text x="249" y="623" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#596266">目标及其表面</text><text x="112" y="693" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">颜色相近 ≠ 光谱相近</text><text x="112" y="738" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">图案、反光、材料反射</text><text x="112" y="783" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">照明条件会改变观测结果</text><rect x="638" y="242" width="524" height="616" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><text x="670" y="267" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#875164">02</text><text x="670" y="315" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#282f31">MWIR / LWIR</text><text x="670" y="374" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#596266">主要观察：热辐射与反射</text><polyline points="738,508 823,450 868,478 958,433" stroke="#875164" stroke-width="4" fill="none" /><polyline points="738,534 823,476 868,504 958,459" stroke="#875164" stroke-width="4" fill="none" /><polyline points="738,560 823,502 868,530 958,485" stroke="#875164" stroke-width="4" fill="none" /><rect x="748" y="572" width="303" height="39" rx="10" fill="#875164" stroke="#875164" stroke-width="2" /><text x="807" y="623" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#596266">目标及其表面</text><text x="670" y="693" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">真实温度 ≠ 热像读数</text><text x="670" y="738" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">发射率与环境辐射共同作用</text><text x="670" y="783" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">持续散热是系统约束</text><rect x="1196" y="242" width="524" height="616" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><text x="1228" y="267" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#376a7b">03</text><text x="1228" y="315" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="35" font-weight="700" fill="#282f31">雷达</text><text x="1228" y="374" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#596266">主要观察：主动波的散射</text><polyline points="1261,448 1429,508 1585,448" stroke="#376a7b" stroke-width="4" fill="none" /><polyline points="1261,474 1429,534 1585,474" stroke="#376a7b" stroke-width="4" fill="none" /><polyline points="1261,500 1429,560 1585,500" stroke="#376a7b" stroke-width="4" fill="none" /><rect x="1306" y="572" width="303" height="39" rx="10" fill="#376a7b" stroke="#376a7b" stroke-width="2" /><text x="1365" y="623" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#596266">目标及其表面</text><text x="1228" y="693" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">光学外观 ≠ 雷达外观</text><text x="1228" y="738" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">频率、方向与极化均重要</text><text x="1228" y="783" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#282f31">特征控制需兼顾本方设备</text><text x="82" y="906" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#596266">概念示意，不按波长比例绘制；常温场景下 SWIR 通常以反射为主，高温目标另需考虑热辐射。</text></svg>