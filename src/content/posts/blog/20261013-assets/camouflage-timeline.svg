<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1030" viewBox="0 0 1800 1030"><rect width="100%" height="100%" fill="#f5f3f0" /><text x="80" y="62" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="62" font-weight="700" fill="#282f31">伪装遮障的百年演变</text><text x="82" y="152" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="400" fill="#596266">观察者改变了，网具要管理的信息也随之改变。</text><rect x="80" y="250" width="524" height="288" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><rect x="80" y="250" width="10" height="288" rx="5" fill="#526754" stroke="#526754" stroke-width="2" /><text x="114" y="278" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#526754">1915—1918</text><text x="114" y="335" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#282f31">专业化起步</text><text x="114" y="401" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">航空观察改变隐蔽条件</text><text x="114" y="447" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">专业机构与炮位网具</text><rect x="638" y="250" width="524" height="288" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><rect x="638" y="250" width="10" height="288" rx="5" fill="#875164" stroke="#875164" stroke-width="2" /><text x="672" y="278" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#875164">1940年代</text><text x="672" y="335" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#282f31">标准化与批量制作</text><text x="672" y="401" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">条令、材料、训练和验收</text><text x="672" y="447" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">轮廓之外还要考虑背景</text><rect x="1196" y="250" width="524" height="288" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><rect x="1196" y="250" width="10" height="288" rx="5" fill="#376a7b" stroke="#376a7b" stroke-width="2" /><text x="1230" y="278" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#376a7b">1957</text><text x="1230" y="335" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#282f31">合成材料路线</text><text x="1230" y="401" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">Barracuda 早期合成网</text><text x="1230" y="447" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">重量与操作便利性改进</text><rect x="80" y="578" width="524" height="288" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><rect x="80" y="578" width="10" height="288" rx="5" fill="#96733e" stroke="#96733e" stroke-width="2" /><text x="114" y="606" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#96733e">1970年代</text><text x="114" y="663" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#282f31">模块化遮障</text><text x="114" y="729" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">网屏、饰装与支撑成套</text><text x="114" y="775" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">雷达散射型 / 透波型</text><rect x="638" y="578" width="524" height="288" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><rect x="638" y="578" width="10" height="288" rx="5" fill="#526754" stroke="#526754" stroke-width="2" /><text x="672" y="606" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#526754">1990年代—2010年代</text><text x="672" y="663" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#282f31">多光谱与平台覆盖</text><text x="672" y="729" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">静态网具与车体覆盖并行</text><text x="672" y="775" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">2018 年 ULCANS 更新研制</text><rect x="1196" y="578" width="524" height="288" rx="22" fill="#e9eae4" stroke="#e9eae4" stroke-width="2" /><rect x="1196" y="578" width="10" height="288" rx="5" fill="#376a7b" stroke="#376a7b" stroke-width="2" /><text x="1230" y="606" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#376a7b">2020年代</text><text x="1230" y="663" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#282f31">多光谱与防无人机并行</text><text x="1230" y="729" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">热辐射设计与多波段研究</text><text x="1230" y="775" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">防护网、车顶笼及组合覆盖</text><text x="82" y="942" dominant-baseline="text-before-edge" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#596266">代表节点 ≠ 全球同步换代     |     制式装备、企业方案与实验室研究应分别判断</text></svg>